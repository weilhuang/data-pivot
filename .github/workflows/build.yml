# GitHub Actions workflow for building, testing, verifying, and preparing plugin release drafts.
# Aligned with https://github.com/JetBrains/intellij-platform-plugin-template
# (build → test → verify → release draft) while keeping this repository's versioned draft-release flow.
#
# Jobs:
# - Build the plugin ZIP with buildPlugin and upload it as a workflow artifact.
# - Run ./gradlew check (unitTest + integrationTest + ideaUiTest) and upload test reports on failure.
# - Run verifyPluginFast (plugin structure only). Plugin Verifier / verifyPluginCompatibility is
#   intentionally not run: it downloads extra IDEs and was dropped in 2.2.0 for time and disk size.
# - Create or refresh a versioned GitHub Release draft on non-pull-request runs.
#
# PR CI on ubuntu-latest runs the full test suite. The OS matrix in run-ui-tests.yml is
# workflow_dispatch + weekly schedule, not part of the PR gate.

name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Maximize Build Space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          large-packages: false

      - name: Fetch Sources
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build plugin
        run: ./gradlew buildPlugin --no-configuration-cache --console=plain

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: plugin-distribution
          path: ./build/distributions/*.zip
          if-no-files-found: error

  test:
    name: Test
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Maximize Build Space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          large-packages: false

      - name: Fetch Sources
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Run Tests
        run: >-
          ./gradlew check
          --continue
          --no-configuration-cache
          --console=plain

      - name: Collect Tests Result
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: tests-result
          path: ${{ github.workspace }}/build/reports/tests
          if-no-files-found: ignore
          retention-days: 7

  verify:
    name: Verify plugin
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Maximize Build Space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          large-packages: false

      - name: Fetch Sources
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Run plugin structure verification
        run: ./gradlew verifyPluginFast --no-configuration-cache --console=plain

      - name: Collect plugin verification reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: plugin-verify-result
          path: |
            ${{ github.workspace }}/build/reports/verifyPlugin
            ${{ github.workspace }}/build/reports/pluginVerifier
          if-no-files-found: ignore
          retention-days: 7

  detect_version:
    name: Detect new version
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      is_new_version: ${{ steps.version.outputs.is_new_version }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Fetch sources
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          version=$(sed -nE 's/^version[[:space:]]*=[[:space:]]*(.+)[[:space:]]*$/\1/p' gradle.properties | head -n 1)
          if [[ -z "$version" ]]; then
            echo "Unable to read version from gradle.properties" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

          # A published git tag means the version is already released; never rebuild it.
          if git rev-parse --verify --quiet "refs/tags/$version" >/dev/null; then
            echo "Version $version already has a tag; nothing to publish."
            echo "is_new_version=false" >> "$GITHUB_OUTPUT"
          elif is_draft=$(gh release view "$version" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft' 2>/dev/null); then
            # A release with this version already exists. Only a published release is
            # final: an existing draft must be rebuilt so its assets and target commit
            # track the latest push instead of remaining stuck on the first run.
            if [[ "$is_draft" == "true" ]]; then
              echo "Version $version has an existing draft release; it will be rebuilt and refreshed."
              echo "is_new_version=true" >> "$GITHUB_OUTPUT"
            else
              echo "Version $version already has a published release; nothing to publish."
              echo "is_new_version=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "Version $version is new and will be released."
            echo "is_new_version=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: Build draft ${{ needs.detect_version.outputs.version }}
    needs: [detect_version, test, verify]
    if: github.event_name != 'pull_request' && needs.detect_version.outputs.is_new_version == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Maximize Build Space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          large-packages: false

      - name: Fetch sources
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Download plugin distribution
        uses: actions/download-artifact@v7
        with:
          name: plugin-distribution
          path: build/distributions

      - name: Create release notes
        env:
          VERSION: ${{ needs.detect_version.outputs.version }}
        run: |
          mkdir -p build/tmp
          ./gradlew getChangelog \
            --project-version "$VERSION" \
            --no-header \
            --no-links \
            --quiet \
            --console=plain \
            --output-file=build/tmp/release-note.md

      - name: Create draft release and upload distribution
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.detect_version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          distributions=(build/distributions/*.zip)

          if (( ${#distributions[@]} == 0 )); then
            echo "No plugin distribution found in build/distributions" >&2
            exit 1
          fi

          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$VERSION" \
              --repo "$GITHUB_REPOSITORY" \
              --draft \
              --target "$GITHUB_SHA" \
              --title "$VERSION" \
              --notes-file build/tmp/release-note.md
            gh release upload "$VERSION" "${distributions[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$VERSION" "${distributions[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --draft \
              --title "$VERSION" \
              --notes-file build/tmp/release-note.md
          fi

# Cross-platform IntelliJ UI component tests.
#
# PR / main CI already runs ideaUiTest on ubuntu-latest via the Build workflow (`./gradlew check`).
# This workflow is the optional OS matrix: workflow_dispatch (manual) and a weekly schedule.
# It does not block pull requests.

name: Run UI component tests

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'

concurrency:
  group: ui-component-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui_component_test:
    name: UI component tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    permissions:
      contents: read
    steps:
      - name: Maximize Build Space
        if: runner.os == 'Linux'
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          large-packages: false

      - name: Fetch sources
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run IntelliJ UI component tests
        run: ./gradlew ideaUiTest --no-configuration-cache --console=plain

      - name: Upload UI test reports on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: ui-test-reports-${{ matrix.os }}-${{ github.run_id }}
          path: build/reports/tests/ideaUiTest
          if-no-files-found: ignore
          retention-days: 7
